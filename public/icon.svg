<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Dark void background -->
  <rect width="16" height="16" fill="#07051a"/>

  <!-- Pixel logo mark centred in 16x16 grid -->
  <!-- Based on the existing logo: a stylised "G" shape in cyan with a lime accent -->

  <!-- Top bar of G -->
  <rect x="4" y="2" width="1" height="1" fill="#3ef2ff"/>
  <rect x="5" y="2" width="1" height="1" fill="#3ef2ff"/>
  <rect x="6" y="2" width="1" height="1" fill="#3ef2ff"/>
  <rect x="7" y="2" width="1" height="1" fill="#3ef2ff"/>
  <rect x="8" y="2" width="1" height="1" fill="#3ef2ff"/>
  <rect x="9" y="2" width="1" height="1" fill="#3ef2ff"/>
  <rect x="10" y="2" width="1" height="1" fill="#3ef2ff"/>

  <!-- Left side top -->
  <rect x="3" y="3" width="1" height="1" fill="#3ef2ff"/>
  <rect x="3" y="4" width="1" height="1" fill="#3ef2ff"/>

  <!-- Left side middle -->
  <rect x="3" y="5" width="1" height="1" fill="#3ef2ff"/>
  <rect x="3" y="6" width="1" height="1" fill="#3ef2ff"/>
  <rect x="3" y="7" width="1" height="1" fill="#3ef2ff"/>

  <!-- Right side (only bottom half, making the G cutout) -->
  <rect x="10" y="7" width="1" height="1" fill="#3ef2ff"/>
  <rect x="10" y="8" width="1" height="1" fill="#3ef2ff"/>

  <!-- Middle crossbar of G (lime accent) -->
  <rect x="7"  y="7" width="1" height="1" fill="#b6ff3b"/>
  <rect x="8"  y="7" width="1" height="1" fill="#b6ff3b"/>
  <rect x="9"  y="7" width="1" height="1" fill="#b6ff3b"/>
  <rect x="10" y="7" width="1" height="1" fill="#b6ff3b"/>

  <!-- Left side bottom -->
  <rect x="3" y="8"  width="1" height="1" fill="#3ef2ff"/>
  <rect x="3" y="9"  width="1" height="1" fill="#3ef2ff"/>
  <rect x="3" y="10" width="1" height="1" fill="#3ef2ff"/>

  <!-- Right side bottom -->
  <rect x="10" y="9"  width="1" height="1" fill="#3ef2ff"/>
  <rect x="10" y="10" width="1" height="1" fill="#3ef2ff"/>

  <!-- Bottom bar of G -->
  <rect x="4"  y="11" width="1" height="1" fill="#3ef2ff"/>
  <rect x="5"  y="11" width="1" height="1" fill="#3ef2ff"/>
  <rect x="6"  y="11" width="1" height="1" fill="#3ef2ff"/>
  <rect x="7"  y="11" width="1" height="1" fill="#3ef2ff"/>
  <rect x="8"  y="11" width="1" height="1" fill="#3ef2ff"/>
  <rect x="9"  y="11" width="1" height="1" fill="#3ef2ff"/>
  <rect x="10" y="11" width="1" height="1" fill="#3ef2ff"/>
</svg>
