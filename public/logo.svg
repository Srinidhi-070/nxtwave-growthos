<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 70 20" width="300" height="100" shape-rendering="crispEdges">
  <defs>
    <style>
      .cyan { fill: #3ef2ff; }
      .lime { fill: #b6ff3b; }
      .text1 { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 8px; font-weight: bold; fill: #111827; }
      @media (prefers-color-scheme: dark) {
        .text1 { fill: #ffffff; }
      }
      .text2 { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 8px; font-weight: bold; fill: #3ef2ff; }
    </style>
  </defs>

  <!-- Scaled up logo mark -->
  <g transform="scale(2) translate(0, 1)">
    <!-- Row 0 -->
    <rect x="1" y="0" width="1" height="1" class="cyan"/>
    <rect x="2" y="0" width="1" height="1" class="cyan"/>
    <rect x="3" y="0" width="1" height="1" class="cyan"/>
    <rect x="4" y="0" width="1" height="1" class="cyan"/>
    <rect x="5" y="0" width="1" height="1" class="cyan"/>
    
    <!-- Row 1 -->
    <rect x="0" y="1" width="1" height="1" class="cyan"/>
    <rect x="1" y="1" width="1" height="1" class="cyan"/>
    
    <!-- Row 2 -->
    <rect x="0" y="2" width="1" height="1" class="cyan"/>
    
    <!-- Row 3 -->
    <rect x="0" y="3" width="1" height="1" class="cyan"/>
    <rect x="4" y="3" width="1" height="1" class="lime"/>
    <rect x="5" y="3" width="1" height="1" class="lime"/>
    <rect x="6" y="3" width="1" height="1" class="lime"/>
    
    <!-- Row 4 -->
    <rect x="0" y="4" width="1" height="1" class="cyan"/>
    <rect x="6" y="4" width="1" height="1" class="cyan"/>
    
    <!-- Row 5 -->
    <rect x="0" y="5" width="1" height="1" class="cyan"/>
    <rect x="1" y="5" width="1" height="1" class="cyan"/>
    <rect x="5" y="5" width="1" height="1" class="cyan"/>
    <rect x="6" y="5" width="1" height="1" class="cyan"/>
    
    <!-- Row 6 -->
    <rect x="1" y="6" width="1" height="1" class="cyan"/>
    <rect x="2" y="6" width="1" height="1" class="cyan"/>
    <rect x="3" y="6" width="1" height="1" class="cyan"/>
    <rect x="4" y="6" width="1" height="1" class="cyan"/>
    <rect x="5" y="6" width="1" height="1" class="cyan"/>
  </g>

  <!-- Text GROWTHOS -->
  <text x="18" y="13" class="text1" letter-spacing="1.5">GROWTH</text>
  <text x="55" y="13" class="text2" letter-spacing="1">OS</text>
</svg>
